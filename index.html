<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WWE España - Calendario Completo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="bg-red-600 text-white font-black px-3 py-1 rounded text-sm tracking-wider">WWE</span>
                <h1 class="text-xl font-bold tracking-tight text-white">Calendario España</h1>
            </div>
            <button id="btn-notificaciones" class="flex items-center gap-2 bg-gray-800 hover:bg-gray-700 text-sm font-medium px-4 py-2 rounded-full transition-colors cursor-pointer text-gray-300">
                <i data-lucide="bell" class="w-4 h-4 text-red-500"></i>
                Activar Alertas
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <div class="mb-12">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2 text-white">
                <i data-lucide="tv" class="text-blue-500"></i> Programas Semanales (En Vivo)
            </h2>
            <div id="lista-semanales" class="grid gap-6 md:grid-cols-2">
                </div>
        </div>

        <hr class="border-gray-800 my-8">

        <div>
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-2 text-white">
                <i data-lucide="trophy" class="text-amber-500"></i> Próximos Premium Live Events (PLE)
            </h2>
            <div id="lista-ples" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
                </div>
        </div>

    </main>

    <script>
        // Base de datos simulada con la cartelera expandida
        const infoShows = {
            semanales: [
                {
                    nombre: "WWE Monday Night Raw",
                    cadenaOriginal: "USA Network / Netflix",
                    color: "border-red-600",
                    badgeColor: "bg-red-600",
                    descripcion: "El show rojo de la WWE. Tres horas de acción en directo.",
                    // Lunes a las 8 PM hora de NY suele ser Martes 02:00 AM en España
                    fechaUTC: obtenerProximoDiaSemana(1, 20, 0) 
                },
                {
                    nombre: "WWE Friday Night SmackDown",
                    cadenaOriginal: "USA Network",
                    color: "border-blue-600",
                    badgeColor: "bg-blue-600",
                    descripcion: "El show azul de la WWE. Las superestrellas de la marca de los viernes.",
                    // Viernes a las 8 PM hora de NY suele ser Sábado 02:00 AM en España
                    fechaUTC: obtenerProximoDiaSemana(5, 20, 0)
                }
            ],
            ples: [
                {
                    titulo: "Money in the Bank",
                    fechaUTC: "2026-07-05T23:00:00Z",
                    imagen: "https://images.unsplash.com/photo-1547941126-3d5323b218b6?w=400&auto=format&fit=crop&q=60",
                    combates: ["Cody Rhodes vs. Randy Orton", "Men's Money in the Bank Ladder Match", "Women's Money in the Bank Ladder Match"]
                },
                {
                    titulo: "SummerSlam",
                    fechaUTC: "2026-08-02T23:00:00Z",
                    imagen: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=400&auto=format&fit=crop&q=60",
                    combates: ["Cartelera por confirmar en televisión"]
                }
            ]
        };

        // Función matemática para calcular el próximo Lunes o Viernes de esta semana de forma automática
        function obtenerProximoDiaSemana(diaDesejado, horaET, minutoET) {
            // Simulamos la conversión base: 8 PM ET son las 00:00 UTC del día siguiente
            const hoy = new Date();
            const resultado = new Date(hoy.getTime());
            resultado.setDate(hoy.getDate() + (diaDesejado + 7 - hoy.getDay()) % 7);
            resultado.setUTCHours(horaET + 4, minutoET, 0, 0); // Ajuste base aproximado a UTC
            return resultado.toISOString();
        }

        function formatearFechaEspaña(isoString) {
            const fecha = new Date(isoString);
            const opcionesFecha = { timeZone: 'Europe/Madrid', weekday: 'long', day: 'numeric', month: 'long' };
            const opcionesHora = { timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit' };
            
            return {
                dia: fecha.toLocaleDateString('es-ES', opcionesFecha),
                hora: fecha.toLocaleTimeString('es-ES', opcionesHora)
            };
        }

        function renderizarApp() {
            // 1. Renderizar Semanales
            const contenedorSemanales = document.getElementById('lista-semanales');
            infoShows.semanales.forEach(show => {
                const tiempo = formatearFechaEspaña(show.fechaUTC);
                contenedorSemanales.innerHTML += `
                    <div class="bg-gray-900 border-l-4 ${show.color} rounded-r-xl p-5 shadow-lg flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <h3 class="text-lg font-bold text-white">${show.nombre}</h3>
                                <span class="${show.badgeColor} text-white font-bold text-[10px] px-2 py-0.5 rounded-full uppercase tracking-wider">Semanal</span>
                            </div>
                            <p class="text-sm text-gray-400 mb-4">${show.descripcion}</p>
                        </div>
                        <div class="bg-gray-950 p-3 rounded-lg border border-gray-800 flex items-center justify-between text-sm">
                            <span class="capitalize text-gray-300 flex items-center gap-15"><i data-lucide="calendar" class="w-4 h-4 text-gray-500 inline"></i> En la madrugada del ${tiempo.dia.split(' ')[0]}</span>
                            <span class="font-bold text-red-500 flex items-center gap-1"><i data-lucide="clock" class="w-4 h-4 inline"></i> ${tiempo.hora} H</span>
                        </div>
                    </div>
                `;
            });

            // 2. Renderizar PLEs
            const contenedorPLEs = document.getElementById('lista-ples');
            infoShows.ples.forEach(ple => {
                const tiempo = formatearFechaEspaña(ple.fechaUTC);
                contenedorPLEs.innerHTML += `
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-xl flex flex-col">
                        <div class="h-32 bg-cover bg-center relative" style="background-image: url('${ple.imagen}')">
                            <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/20 to-transparent"></div>
                        </div>
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="text-md font-bold text-white mb-3">${ple.titulo}</h3>
                                <div class="bg-gray-950 p-2.5 rounded-lg border border-gray-800/60 text-xs space-y-1 mb-4">
                                    <p class="capitalize text-gray-300 font-medium">${tiempo.dia}</p>
                                    <p class="text-red-400 font-semibold">Madrugada — ${tiempo.hora} H</p>
                                </div>
                            </div>
                            <div>
                                <h4 class="text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-2">Combates Destacados</h4>
                                <ul class="text-xs text-gray-400 space-y-1">
                                    ${ple.combates.map(c => `<li>• ${c}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    </div>
                `;
            });

            lucide.createIcons();
        }

        // Simulación de alertas
        document.getElementById('btn-notificaciones').addEventListener('click', () => {
            alert("¡Alertas configuradas! Te enviaremos un aviso antes de que empiece Raw, SmackDown o cualquier PLE.");
        });

        window.onload = renderizarApp;
    </script>
</body>
</html>
