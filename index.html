<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WWE España - Calendario de Eventos</title>
    <!-- Tailwind CSS para el diseño visual -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

    <!-- Navbar -->
    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="bg-red-600 text-white font-black px-3 py-1 rounded text-sm tracking-wider">WWE</span>
                <h1 class="text-xl font-bold tracking-tight text-white">Calendario España</h1>
            </div>
            <button id="btn-notificaciones" class="flex items-center gap-2 bg-gray-800 hover:bg-gray-700 text-sm font-medium px-4 py-2 rounded-full transition-colors cursor-pointer text-gray-300">
                <i data-lucide="bell" class="w-4 h-4 text-red-500"></i>
                Activar Alertas
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <!-- Banner Informativo Zona Horaria -->
        <div class="mb-8 p-4 bg-red-950/40 border border-red-900/60 rounded-xl flex items-start gap-3">
            <i data-lucide="info" class="w-5 h-5 text-red-400 shrink-0 mt-0.5"></i>
            <div>
                <p class="text-sm font-medium text-red-200">Conversión Horaria Automatizada</p>
                <p class="text-xs text-red-400/80 mt-0.5">Todos los eventos muestran la hora exacta calculada para tu ubicación actual en España, teniendo en cuenta los cambios de horario de verano e invierno de la península.</p>
            </div>
        </div>

        <h2 class="text-2xl font-bold mb-6 flex items-center gap-2 text-white">
            <i data-lucide="calendar" class="text-red-500"></i> Próximos Premium Live Events
        </h2>

        <!-- Contenedor de Eventos -->
        <div id="lista-eventos" class="grid gap-6 md:grid-cols-2">
            <!-- El evento se inyectará dinámicamente aquí mediante JavaScript -->
        </div>
    </main>

    <script>
        // Simulamos los datos que vendrán de la base de datos (guardados por tu scraper en UTC)
        const eventosDesdeBD = [
            {
                id: 1,
                titulo: "Money in the Bank",
                imagen: "https://images.unsplash.com/photo-1599058917212-d750089bc07e?w=500&auto=format&fit=crop&q=60", // Imagen genérica de wrestling
                fechaUTC: "2026-07-05T23:00:00Z", // Hora de ejemplo en UTC
                combates: [
                    "Cody Rhodes vs. Randy Orton — WWE Championship Match",
                    "Damian Priest vs. Gunther — World Heavyweight Championship",
                    "Men's Money in the Bank Ladder Match",
                    "Women's Money in the Bank Ladder Match"
                ]
            }
        ];

        function cargarEventos() {
            const contenedor = document.getElementById('lista-eventos');
            
            eventosDesdeBD.forEach(evento => {
                // Convertimos la fecha UTC de la base de datos a la hora local de España
                const fechaObjeto = new Date(evento.fechaUTC);
                
                // Formateamos la fecha amigable
                const fechaEspaña = fechaObjeto.toLocaleDateString('es-ES', {
                    timeZone: 'Europe/Madrid',
                    weekday: 'long',
                    day: 'numeric',
                    month: 'long'
                });

                // Formateamos la hora exacta
                const horaEspaña = fechaObjeto.toLocaleTimeString('es-ES', {
                    timeZone: 'Europe/Madrid',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // Creamos la tarjeta del evento en HTML
                const tarjetaHTML = `
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-xl hover:border-gray-700 transition-all flex flex-col">
                        <div class="h-48 bg-cover bg-center relative" style="background-image: url('${evento.imagen}')">
                            <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40 to-transparent"></div>
                            <span class="absolute top-4 right-4 bg-red-600 text-white font-bold text-xs uppercase px-2.5 py-1 rounded-full tracking-wider shadow">LIVE</span>
                        </div>
                        
                        <div class="p-6 flex-1 flex flex-col">
                            <h3 class="text-xl font-bold text-white mb-2">${evento.titulo}</h3>
                            
                            <!-- Horarios España -->
                            <div class="space-y-2 mb-6 bg-gray-950 p-3 rounded-lg border border-gray-800/80">
                                <div class="flex items-center gap-2 text-sm text-gray-300">
                                    <i data-lucide="calendar-days" class="w-4 h-4 text-red-500"></i>
                                    <span class="capitalize">${fechaEspaña}</span>
                                </div>
                                <div class="flex items-center gap-2 text-sm text-gray-300 font-semibold">
                                    <i data-lucide="clock" class="w-4 h-4 text-red-500"></i>
                                    <span>Madrugada del sábado al domingo — ${horaEspaña} H</span>
                                </div>
                            </div>

                            <h4 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">Cartelera Confirmada</h4>
                            <ul class="space-y-2.5 flex-1">
                                ${evento.combates.map(combate => `
                                    <li class="text-sm text-gray-300 flex items-start gap-2">
                                        <span class="text-red-500 mt-1">•</span>
                                        <span>${combate}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                `;
                contenedor.innerHTML += tarjetaHTML;
            });

            // Inicializamos los iconos de Lucide
            lucide.createIcons();
        }

        // Manejador del botón de notificaciones web (Pop-up simulado)
        document.getElementById('btn-notificaciones').addEventListener('click', () => {
            if (!("Notification" in window)) {
                alert("Este navegador no soporta notificaciones de escritorio.");
                return;
            }
            
            Notification.requestPermission().then(permiso => {
                if (permiso === "granted") {
                    new Notification("¡WWE Alertas Activas!", {
                        body: "Te avisaremos de los cambios en las carteleras y el inicio de los shows.",
                        icon: "https://fav.farm/🔥"
                    });
                }
            });
        });

        // Arrancar la app al cargar la página
        window.onload = cargarEventos;
    </script>
</body>
</html>
